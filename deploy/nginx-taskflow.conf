# VM1 (Nginx / reverse proxy) -> /etc/nginx/sites-available/taskflow
# Qeyd: BACKEND_IP əvəzinə VM2-nin daxili IP ünvanını yazın (məs. 192.168.56.12)

upstream taskflow_backend {
    server BACKEND_IP:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # öz domeninizlə əvəz edin

    # Certbot HTTPS qurandan sonra bu blok avtomatik 443-ə yönləndirəcək
    access_log /var/log/nginx/taskflow.access.log;
    error_log  /var/log/nginx/taskflow.error.log;

    client_max_body_size 1m;

    # Statik fayllar birbaşa Nginx-dən (istəyə bağlı: faylları VM1-ə kopyalayın)
    # location /static/ {
    #     alias /var/www/taskflow/static/;
    #     expires 7d;
    # }

    location / {
        proxy_pass http://taskflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
